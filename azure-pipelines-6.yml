trigger:
- main  # Replace with your actual branch name

pool:
  name: 'default'          # Your private agent pool name
  demands:
    - Agent.Name -equals Muneer

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildWebApp
    displayName: 'Build Web Application'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: NuGetToolInstaller@1
      inputs:
        versionSpec: '5.8'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '**/*.sln'

    - task: DotNetCoreCLI@2
      displayName: 'Build Web Application'
      inputs:
        command: 'build'
        projects: 'ASP.NET/myapp/MyApp.Web.csproj'  # Correct web app project file
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Web Application'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'ASP.NET/myapp/MyApp.Web.csproj'  # Ensure correct .csproj is published
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
