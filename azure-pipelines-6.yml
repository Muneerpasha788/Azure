trigger:
- main

pool:
  name: 'default'
  demands:
    - Agent.Name -equals Muneer

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildWebApp
    displayName: 'Build Web Application'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: NuGetToolInstaller@1
      inputs:
        versionSpec: '5.8'

    # Debugging Step: List files in repo
    - script: dir $(Build.SourcesDirectory) /s /b
      displayName: 'List all files in repo'

    # Corrected project path based on structure
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '**/*.sln'  

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: '**/MySql.Web.sln'  # Ensure correct path
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Web Application'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'ASP.NET\mysql-connector-net\MySql.Web\src\MySql.Web.csproj'
        arguments: '-configuration Release --framework net48 --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
