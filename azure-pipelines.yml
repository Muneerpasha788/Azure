# azure-pipelines.yml

trigger:
- main  # Replace 'main' with your branch name if needed

pool:
  name: 'default'          # Your private agent pool name
  demands:
    - Agent.Name -equals Pasha

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            # Write your PowerShell commands here.
            
            Write-Host "Hello World"