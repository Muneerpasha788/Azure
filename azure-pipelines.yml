trigger:
- main

pool:
  name: 'default'
  demands:
    - Agent.Name -equals Muneer

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            # Ensure the Microsoft.PowerShell.Security module is loaded
            Import-Module Microsoft.PowerShell.Security -ErrorAction SilentlyContinue
            Remove-Module Microsoft.PowerShell.Security -ErrorAction SilentlyContinue
            Import-Module Microsoft.PowerShell.Security

            # Output the PowerShell version for debugging
            Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
            
            # Test writing to console
            Write-Host "Hello World"
