# azure-pipelines.yml

trigger:
- main  # Replace 'main' with your branch name if needed

pool:
  name: 'default'          # Your private agent pool name
  demands:
    - Agent.Name -equals Pasha

jobs:
- job: DisplayName
  displayName: 'Display Name'
  steps:
  - script: echo "Hello, [Your Name]!"  # Replace [Your Name] with your actual name
    displayName: 'Display Name Message'