# Database configuration for MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/petclinic?useSSL=false&serverTimezone=UTC
spring.datasource.username=springuser
spring.datasource.password=springpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update   # Or 'none' if you don't want Hibernate to manage schema

# Profile
spring.profiles.active=mysql  # Ensure you have a mysql profile or remove if not needed

# Other configurations (logging, resources, etc.)
spring.thymeleaf.mode=HTML
spring.jpa.open-in-view=false
spring.messages.basename=messages/messages
management.endpoints.web.exposure.include=*
logging.level.org.springframework=INFO
spring.web.resources.cache.cachecontrol.max-age=12h
