trigger:
  branches:
    include:
    - main
pool:
  name: 'private'
  demands:
  - Agent.Name -equals Muneerpasha
stages:
- stage: Build
  displayName: Build
  jobs:
  - job: terraform
    displayName: 'youtube clone'
    steps:
    - task: NodeTool@0
      inputs:
        versionSource: 'spec'
        versionSpec: '6.x'
    - task: Npm@1
      inputs:
        command: 'install'
        workingDir: 'Azure /Youtube_Clone/'
    - task: Npm@1
      inputs:
        command: 'custom'
        workingDir: 'Azure /Youtube_Clone/'
        customCommand: 'run build'
    
  

  