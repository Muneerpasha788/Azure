# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '2f54aaed-e30c-4ad8-87a7-0170880895f2'
  imageRepository: 'nginx'
  containerRegistry: 'muneeracrregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfiles/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  pool:
  name: 'private'
  demands:
  - Agent.Name -equals Muneerpasha'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
