trigger:
  branches:
    include:
    - main
pool:
  name: 'default'
  demands:
  - Agent.Name -equals Linux

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Dockerfiles/Dockerfile'
        tags: |
          $(tag)
